[project]
name = "jobapplier"
version = "0.1.0"
description = "Self-hosted, permission-aware job discovery, matching and application preparation"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi==0.141.1",           # MIT
  "uvicorn[standard]==0.53.0",  # BSD-3-Clause
  "SQLAlchemy==2.1.0",          # MIT
  "alembic==1.20.0",            # MIT
  "pydantic==2.13.5",           # MIT
  "pydantic-settings==2.15.0",  # MIT
  "email-validator==2.3.0",     # Unlicense
  "psycopg[binary]==3.3.6",     # LGPL-3.0 (dynamically linked, unmodified: OK for self-hosting)
  "celery==5.6.3",              # BSD-3-Clause
  "redis==8.1.0",               # MIT
  "httpx==0.28.1",              # BSD-3-Clause
  "pypdf==6.19.0",              # BSD-3-Clause
  "python-docx==1.2.0",         # MIT
  "cryptography==50.0.1",       # Apache-2.0 OR BSD-3-Clause
  "argon2-cffi==25.1.0",        # MIT
  "PyOTP==2.10.0",              # MIT
  "prometheus_client==0.26.0",  # Apache-2.0 AND BSD-2-Clause
  "PyYAML==6.0.3",              # MIT
  "python-multipart==0.0.32",   # Apache-2.0
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "respx==0.23.1"]  # MIT, BSD-3-Clause

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.setuptools]
packages = ["app"]
