# Source permission registry. This is the single source of truth for which sources may be used, and how.
#
# Rules enforced in code (app/connectors/registry.py):
#   - A source can only be enabled if read_permitted: true.
#   - A connector refuses to run if date_checked is older than JA_SOURCE_RECHECK_DAYS (default 90 days).
#   - Auto-submit requires submit_permitted: true AND a verified submission adapter AND user opt-in.
#
# To add a source: copy the template at the bottom, read the provider's CURRENT terms and API docs,
# fill in every field, and record the review in docs/SOURCE_REGISTRY.md. Do not guess any field.

sources:
  - key: greenhouse
    name: Greenhouse Job Board API
    method: public_rest_get
    base_url: https://boards-api.greenhouse.io/v1/boards/{board_token}/jobs?content=true
    docs_url: https://docs.greenhouse.io/job-board.html
    terms_url: https://www.greenhouse.com/legal
    date_checked: "2026-09-24"
    rate_limit_per_minute: 20        # self-imposed; docs state no limit for GET
    fields: [id, title, location, content, updated_at, absolute_url, departments, offices, metadata]
    attribution: "Link to the employer's Greenhouse posting (absolute_url); do not re-host as own listings."
    read_permitted: true
    read_basis: "Docs: 'Job Board data is publicly available, so authentication is not required for any GET endpoints.'"
    submit_permitted: false
    submit_basis: "POST /applications requires the EMPLOYER's Job Board API key (HTTP Basic). Not available to candidates."
    notes: "Per-employer boards only (board_token). Personal, non-commercial use; no redistribution."

  - key: lever
    name: Lever Postings API
    method: public_rest_get
    base_url: https://api.lever.co/v0/postings/{board_token}?mode=json
    docs_url: https://github.com/lever/postings-api
    terms_url: https://www.lever.co/terms-of-service/
    date_checked: "2026-09-24"
    rate_limit_per_minute: 20
    fields: [id, text, categories, descriptionPlain, lists, hostedUrl, applyUrl, createdAt, workplaceType, salaryRange]
    attribution: "Link to hostedUrl/applyUrl."
    read_permitted: true
    read_basis: "Docs: published postings are publicly viewable and 'may be scraped by third parties'."
    submit_permitted: false
    submit_basis: "Apply POST requires ?key= generated by the EMPLOYER's Super Admin. Not available to candidates."
    notes: "EU instance: api.eu.lever.co. Only global instance implemented."

  - key: ashby
    name: Ashby Job Posting API
    method: public_rest_get
    base_url: https://api.ashbyhq.com/posting-api/job-board/{board_token}?includeCompensation=true
    docs_url: https://developers.ashbyhq.com/docs/public-job-posting-api
    terms_url: https://www.ashbyhq.com/terms
    date_checked: "2026-09-24"
    rate_limit_per_minute: 20
    fields: [id, title, location, department, employmentType, isRemote, workplaceType, descriptionPlain, publishedAt, jobUrl, applyUrl, compensation]
    attribution: "Link to jobUrl/applyUrl."
    read_permitted: true
    read_basis: "Public, unauthenticated posting API that employers expose for custom careers pages."
    submit_permitted: false
    submit_basis: "API is read-only; candidates apply on Ashby's hosted page."
    notes: "Re-check terms quarterly; docs do not address third-party aggregation explicitly."

  - key: dice
    name: Dice (official MCP job search)
    method: mcp_search
    base_url: https://mcp.dice.com/mcp
    docs_url: https://www.dice.com/about/mcp
    terms_url: https://www.dice.com/about/terms-and-conditions
    date_checked: "2026-09-24"
    rate_limit_per_minute: 10
    fields: [guid, title, summary, companyName, salary, workplaceTypes, employmentType, postedDate, detailsPageUrl]
    attribution: "These job listings were found using AI-powered search. Please review all job details carefully and verify information directly with employers before applying."
    read_permitted: true
    read_basis: "Dice MCP docs list 'Custom MCP clients' as supported and state 'No authentication is required for basic usage.' Search via Dice's official server, not scraping (ToS 8.2(aa) bans scrapers)."
    submit_permitted: false
    submit_basis: "Tool description: 'DO NOT use for: applying to jobs'. ToS 8.2(j) bans unapproved tools. Apply on dice.com (handoff)."
    notes: "Saved searches, not employer boards. get_job_details only on user request (tool guidance). Must display the AI-search disclosure. ToS 8.2(k): never use Dice data to train/improve ML models (descriptions are never sent to the LLM)."

  - key: email_alert
    name: Job-alert emails (LinkedIn, Indeed, ZipRecruiter, Dice, Ladders)
    method: user_mailbox_import
    base_url: ""
    docs_url: https://www.linkedin.com/help/linkedin/answer/a511279
    terms_url: ""
    date_checked: "2026-09-24"
    rate_limit_per_minute: 0
    fields: [title, company, location, salary line, job link]
    attribution: "Imported from your own job-alert emails. Links open the job site in your browser."
    read_permitted: true
    read_basis: "The user's own mailbox: alert emails the sites send to the user. No site is contacted; links are not followed."
    submit_permitted: false
    submit_basis: "All five sites prohibit automated applying (e.g. Indeed A.3.5; LinkedIn User Agreement 8.2). Handoff only."
    notes: "Only mail from the sites' own domains is parsed. Job links must point at the site's own domain. Listings expire after JA_IMPORTED_LISTING_TTL_DAYS unseen."

  - key: user_import
    name: Your own imports (manual add, LinkedIn data export)
    method: user_provided
    base_url: ""
    docs_url: https://www.linkedin.com/help/linkedin/answer/a1339364
    terms_url: ""
    date_checked: "2026-09-24"
    rate_limit_per_minute: 0
    fields: [url, title, company, description (pasted), saved/applied date]
    attribution: ""
    read_permitted: true
    read_basis: "Data the user provides: pasted listings, or the user's own LinkedIn export (Saved Jobs, Job Applications)."
    submit_permitted: false
    submit_basis: "No automated submission to any job site. Handoff only."
    notes: "LinkedIn 'Job Applications' rows become SUBMITTED (external) records so the duplicate guard knows about them."

  # ---------------------------------------------------------------- SITES: direct access NOT PERMITTED
  - key: linkedin
    name: LinkedIn (direct)
    method: none
    base_url: ""
    docs_url: https://learn.microsoft.com/en-us/linkedin/talent/job-postings/api/overview
    terms_url: https://www.linkedin.com/legal/user-agreement
    date_checked: "2026-09-24"
    rate_limit_per_minute: 0
    fields: []
    attribution: ""
    read_permitted: false
    read_basis: "User Agreement 8.2 bans software/scripts/bots that scrape or copy the Services. The Job Posting API is not accepting new partners; Apply Connect is ATS-only."
    submit_permitted: false
    submit_basis: "Bots and unauthorized automated methods banned (8.2); no candidate apply API."
    notes: "Supported instead via email_alert and user_import (data export: Saved Jobs, Job Applications)."

  - key: indeed
    name: Indeed (direct)
    method: none
    base_url: ""
    docs_url: https://docs.indeed.com/legal-terms/indeed-apply
    terms_url: https://www.indeed.com/legal
    date_checked: "2026-09-24"
    rate_limit_per_minute: 0
    fields: []
    attribution: ""
    read_permitted: false
    read_basis: "Terms 21: no automated systems (bots, scrapers, spiders, AI or Agentic AI) without express written permission. Publisher API closed; RSS removed."
    submit_permitted: false
    submit_basis: "A.3.5: 'Use of any automation, scripting, or bots to automate the Indeed Apply process outside of Indeed's official vendors and tooling is prohibited.'"
    notes: "Supported instead via email_alert and user_import. Indeed's official Claude connector is Claude-only and cannot be used by this app."

  - key: ziprecruiter
    name: ZipRecruiter (direct)
    method: none
    base_url: ""
    docs_url: https://www.ziprecruiter.com/partner/documentation/mcp-connector/
    terms_url: https://www.ziprecruiter.global/en/terms
    date_checked: "2026-09-24"
    rate_limit_per_minute: 0
    fields: []
    attribution: ""
    read_permitted: false
    read_basis: "Terms ban crawling/scraping and automated means. The Job Search MCP is documented for AI assistants via the Anthropic/ChatGPT directories; no public endpoint or terms for self-hosted clients, so NOT verified."
    submit_permitted: false
    submit_basis: "No candidate apply API; partner API is ATS/HRIS/staffing only."
    notes: "Supported instead via email_alert and user_import. Re-review if ZipRecruiter publishes MCP terms for custom clients."

  - key: ladders
    name: Ladders (direct)
    method: none
    base_url: ""
    docs_url: ""
    terms_url: https://www.theladders.com/corporate/terms
    date_checked: "2026-09-24"
    rate_limit_per_minute: 0
    fields: []
    attribution: ""
    read_permitted: false
    read_basis: "Terms ban 'any robot, spider, scraper or other automated means to access the Site.' No job-seeker API."
    submit_permitted: false
    submit_basis: "No third-party apply route (Ladders sells its own Apply4Me)."
    notes: "Supported instead via email_alert and user_import."

