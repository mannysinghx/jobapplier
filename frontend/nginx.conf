# jobApplier web: serves the built SPA and proxies /api/ to the FastAPI service ("api" in docker-compose).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Resume uploads are capped at 10 MB and LinkedIn export ZIPs at 50 MB by the API; allow a little overhead.
    client_max_body_size 55m;

    # Security headers for every response (inherited by the locations below, none of which use add_header).
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location /api/ {
        # No URI on proxy_pass: the /api prefix is passed through unchanged (the API mounts its routers at /api).
        proxy_pass http://api:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering on;
        # "Poll now" fetches every enabled board synchronously and can take a while.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Hashed build assets never change: cache them hard. (`expires` does not reset the inherited add_header set.)
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location = /favicon.ico {
        access_log off;
        return 204;
    }

    # SPA fallback. index.html itself must not be cached so new builds are picked up.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
